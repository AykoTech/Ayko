name: Context Isolation Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "src/core/core.py"
      - "tests/integration/test_full_flow.py"
      - ".github/workflows/context-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-isolation:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run context-isolation regression test
        run: python -m pytest -q tests/integration/test_full_flow.py::test_failed_tool_cannot_mutate_live_context

      - name: Run integration tests
        run: python -m pytest -q tests/integration/test_full_flow.py

      - name: Run complete test suite
        run: python -m pytest -q
