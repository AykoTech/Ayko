name: Context Isolation and Tool Security Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "src/core/core.py"
      - "src/core/tool_runtime.py"
      - "src/core/tool_security.py"
      - "tests/integration/test_full_flow.py"
      - "tests/unit/test_tool_security.py"
      - ".github/workflows/context-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tool security policy tests
        run: python -m pytest -q tests/unit/test_tool_security.py

      - name: Run context-isolation regression test
        run: python -m pytest -q tests/integration/test_full_flow.py::test_failed_tool_cannot_mutate_live_context

      - name: Run integration tests
        run: python -m pytest -q tests/integration/test_full_flow.py

      - name: Run automated test suite (exclude hardware diagnostic)
        run: python -m pytest -q --ignore=tests/test_audio.py
